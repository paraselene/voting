{% load static %}<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#59377c"><title>{% block title %}教會執事選舉{% endblock %}</title><link rel="stylesheet" href="{% static 'election/style.css' %}"><script src="{% static 'election/vote.js' %}" defer></script></head>
<body><header><a href="/" class="brand">教會執事選舉</a>{% if identity %}<form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="quiet">登出</button></form>{% endif %}</header><main>{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}{% block content %}{% endblock %}</main><footer>請妥善保管你的登入憑證</footer></body></html>
